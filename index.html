<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoRadar 66</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111;--paper:#fff;--soft:#f1f3f8;--blue:#2f5df4;--green:#1faa59;--red:#e8452c;--muted:#6b7280;
  --display:'Fredoka',system-ui,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:var(--body);color:var(--ink);background:var(--paper)}
#map{position:absolute;inset:0}
.topbar{position:absolute;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--display);font-weight:700;font-size:20px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.count{font-family:var(--display);font-weight:600;background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px var(--body);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.fab-col{position:absolute;z-index:1000;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab[aria-pressed="true"]{background:var(--blue);color:#fff}
.legend{position:absolute;z-index:1000;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;font:600 13px var(--body);display:grid;gap:5px}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.dock{position:absolute;z-index:1000;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;gap:12px;pointer-events:none}
.dock>*{pointer-events:auto}
.btn{font:700 17px var(--display);background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:12px 22px;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.red{background:var(--red)}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active,.fab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* pins */
.pin{position:relative;width:54px;height:64px}
.pin .ring{width:54px;height:54px;border-radius:50%;background:#fff center/cover no-repeat;border:4px solid var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pin.done .ring{border-color:var(--green)}
.pin::after{content:"";position:absolute;left:19px;top:50px;border:8px solid transparent;border-top:12px solid var(--blue)}
.pin.done::after{border-top-color:var(--green)}
.pin.sel .ring{transform:scale(1.15);transform-origin:50% 100%}
.school{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;border:4px solid #fff;display:grid;place-items:center;font:700 17px var(--display);box-shadow:0 0 0 3px var(--ink)}
.me{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)}
/* sheet */
.sheet{position:absolute;z-index:1100;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ink);opacity:.25;margin:0 auto 10px}
.sheet img.photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;border:3px solid var(--ink)}
.meta{font-size:13px;color:var(--muted);margin:8px 0 10px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font:600 13px var(--body)}
textarea,input[type=text]{font:16px var(--body);border:2px solid var(--ink);border-radius:12px;padding:9px 11px;width:100%;background:var(--paper);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;justify-content:center}
.toast{position:absolute;z-index:1200;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);background:var(--ink);color:#fff;font:600 14px var(--body);padding:9px 16px;border-radius:999px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.menu{position:absolute;z-index:1150;right:74px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);max-width:calc(100% - 90px);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:8px;display:grid;gap:4px;min-width:220px}
.menu button{font:600 15px var(--body);text-align:left;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--soft)}
.leaflet-container{font-family:var(--body)}
</style>
</head>
<body>
<div id="map" aria-label="Mapa de problemas ambientales"></div>

<div class="topbar">
  <div class="brand">
    <div class="logo">EcoRadar 66</div>
    <div class="count" id="count">0 registros</div>
  </div>
  <div class="chips" id="filters" role="group" aria-label="Filtrar por tipo"></div>
</div>

<div class="legend" aria-label="Referencias">
  <span><i class="dot" style="background:var(--blue)"></i>Pendiente</span>
  <span><i class="dot" style="background:var(--green)"></i>Resuelto</span>
  <span><i class="dot" style="background:var(--ink)"></i>Escuela 66</span>
</div>

<div class="fab-col">
  <button class="fab" id="fabSchool" title="Ir a la escuela" aria-label="Ir a la escuela"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6M5 10v9h14v-9M10 19v-5h4v5"/></svg></button>
  <button class="fab" id="fabMe" title="Mi ubicación" aria-label="Mi ubicación"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>
  <button class="fab" id="fabSat" aria-pressed="false" title="Vista satélite" aria-label="Vista satélite"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
  <button class="fab" id="fabMenu" title="Más opciones" aria-label="Más opciones"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
</div>

<div class="menu" id="menu" hidden>
  <button id="mSetSchool">Fijar la escuela en el punto que toque</button>
  <button id="mSchoolHere">Fijar la escuela en mi ubicación actual</button>
  <button id="mCsv">Exportar planilla (CSV)</button>
  <button id="mJson">Exportar copia completa (JSON)</button>
  <button id="mImport">Importar copia (JSON)</button>
  <button id="mClose" style="text-align:center;border-top:2px solid var(--soft)">Cerrar</button>
</div>

<div class="dock">
  <button class="btn" id="btnCam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Sacar foto</button>
  <button class="btn alt" id="btnGal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 9"/></svg>Galería</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Detalle del registro"></div>
<div class="toast" id="toast" role="status"></div>

<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*" hidden>
<input type="file" id="inImp" accept="application/json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var CATS=[
  {id:'basural',name:'Basural'},
  {id:'agua',name:'Agua contaminada'},
  {id:'quema',name:'Quema / humo'},
  {id:'cloaca',name:'Cloaca / desborde'},
  {id:'arbol',name:'Arbolado / espacio verde'},
  {id:'otro',name:'Otro'}
];
var catName=function(id){var c=CATS.filter(function(x){return x.id===id})[0];return c?c.name:'Otro'};
/* Posición aproximada de Temperley. Se corrige con "Fijar la escuela" desde el menú. */
var DEFAULT_SCHOOL={lat:-34.7745,lng:-58.3980};
var school=load('eco66_school',DEFAULT_SCHOOL);
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- base de datos de fotos (IndexedDB) ---------- */
var db;
function openDB(){return new Promise(function(res,rej){
  var r=indexedDB.open('ecoradar66',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('reports',{keyPath:'id'})};
  r.onsuccess=function(){db=r.result;res()};r.onerror=function(){rej(r.error)};
})}
function tx(mode,fn){return new Promise(function(res,rej){
  var t=db.transaction('reports',mode),s=t.objectStore('reports'),out=fn(s);
  t.oncomplete=function(){res(out&&out.result)};t.onerror=function(){rej(t.error)};
})}
var all=function(){return tx('readonly',function(s){return s.getAll()})};
var put=function(o){return tx('readwrite',function(s){return s.put(o)})};
var del=function(id){return tx('readwrite',function(s){return s.delete(id)})};

/* ---------- mapa ---------- */
var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([school.lat,school.lng],16);
var street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes &copy; Esri'});
street.addTo(map);
var schoolMarker,schoolCircle,meMarker;
function drawSchool(){
  if(schoolMarker){map.removeLayer(schoolMarker);map.removeLayer(schoolCircle)}
  schoolCircle=L.circle([school.lat,school.lng],{radius:400,color:'#111',weight:2,dashArray:'6 6',fillColor:'#2f5df4',fillOpacity:.06,interactive:false}).addTo(map);
  schoolMarker=L.marker([school.lat,school.lng],{icon:L.divIcon({className:'',html:'<div class="school">66</div>',iconSize:[46,46],iconAnchor:[23,23]}),zIndexOffset:-500}).addTo(map);
  schoolMarker.bindTooltip('Escuela 66');
}
drawSchool();

/* ---------- registros y pines ---------- */
var reports=[],markers={},filter='todos',selected=null,moving=false;
function pinIcon(r,sel){
  return L.divIcon({className:'',iconSize:[54,64],iconAnchor:[27,62],
    html:'<div class="pin'+(r.status==='resuelto'?' done':'')+(sel?' sel':'')+'"><div class="ring" style="background-image:url('+r.thumb+')"></div></div>'});
}
function render(){
  Object.keys(markers).forEach(function(k){map.removeLayer(markers[k])});markers={};
  var shown=reports.filter(function(r){return filter==='todos'||r.cat===filter});
  shown.forEach(function(r){
    var m=L.marker([r.lat,r.lng],{icon:pinIcon(r,r.id===selected),draggable:false}).addTo(map);
    m.on('click',function(){openSheet(r.id)});
    m.on('dragend',function(){var p=m.getLatLng();r.lat=p.lat;r.lng=p.lng;put(r);toast('Ubicación actualizada')});
    markers[r.id]=m;
  });
  var n=reports.length;
  document.getElementById('count').textContent=n+(n===1?' registro':' registros');
}
function drawFilters(){
  var el=document.getElementById('filters');el.innerHTML='';
  [{id:'todos',name:'Todos'}].concat(CATS).forEach(function(c){
    var b=document.createElement('button');b.className='chip';b.textContent=c.name;
    b.setAttribute('aria-pressed',String(filter===c.id));
    b.onclick=function(){filter=c.id;drawFilters();render()};
    el.appendChild(b);
  });
}

/* ---------- fotos ---------- */
function shrink(file,max,q){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    res(c.toDataURL('image/jpeg',q));
  };
  img.onerror=function(){rej(new Error('No se pudo leer la imagen'))};img.src=url;
})}
function whereAmI(){return new Promise(function(res){
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res(null)},{enableHighAccuracy:true,timeout:8000,maximumAge:15000});
})}
async function addFromFile(file){
  if(!file)return;
  toast('Guardando foto…');
  try{
    var photo=await shrink(file,1000,.8),thumb=await shrink(file,120,.7),pos=await whereAmI(),c=map.getCenter();
    var r={id:'r'+Date.now(),photo:photo,thumb:thumb,cat:'basural',note:'',status:'pendiente',created:new Date().toISOString(),
      lat:pos?pos.lat:c.lat,lng:pos?pos.lng:c.lng,gps:!!pos};
    await put(r);reports.push(r);render();
    map.setView([r.lat,r.lng],Math.max(map.getZoom(),17));
    openSheet(r.id);
    toast(pos?'Foto guardada en tu ubicación':'Sin GPS: arrastrá el pin para ubicarla');
    if(!pos)startMove(r.id);
  }catch(e){toast('No se pudo guardar la foto')}
}

/* ---------- panel de edición ---------- */
var sheet=document.getElementById('sheet');
function openSheet(id){
  var r=reports.filter(function(x){return x.id===id})[0];if(!r)return;
  var prev=selected;selected=id;if(prev&&markers[prev]){var pr=reports.filter(function(x){return x.id===prev})[0];if(pr)markers[prev].setIcon(pinIcon(pr,false))}
  if(markers[id])markers[id].setIcon(pinIcon(r,true));
  var d=new Date(r.created);
  sheet.innerHTML='<div class="grab"></div><img class="photo" alt="Foto del registro" src="'+r.photo+'">'+
   '<div class="meta">'+d.toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+
   ' · '+r.lat.toFixed(5)+', '+r.lng.toFixed(5)+'</div>'+
   '<div class="field"><label>Tipo de problema</label><div class="cats" id="sCats"></div></div>'+
   '<div class="field"><label for="sNote">Descripción</label><textarea id="sNote" placeholder="Ej.: bolsas y escombros en la vereda, frente a la escuela"></textarea></div>'+
   '<div class="row"><button class="btn alt" id="sStatus"></button><button class="btn alt" id="sMove"></button></div>'+
   '<div class="row" style="margin-top:12px"><button class="btn" id="sSave">Guardar</button><button class="btn red" id="sDel">Eliminar</button></div>';
  sheet.classList.add('open');
  var cats=document.getElementById('sCats'),cur=r.cat;
  CATS.forEach(function(c){
    var b=document.createElement('button');b.className='chip';b.textContent=c.name;b.setAttribute('aria-pressed',String(cur===c.id));
    b.onclick=function(){cur=c.id;[].forEach.call(cats.children,function(x,i){x.setAttribute('aria-pressed',String(CATS[i].id===cur))})};
    cats.appendChild(b);
  });
  var note=document.getElementById('sNote');note.value=r.note||'';
  var st=document.getElementById('sStatus'),status=r.status;
  var lab=function(){st.textContent=status==='resuelto'?'Marcar pendiente':'Marcar resuelto'};lab();
  st.onclick=function(){status=status==='resuelto'?'pendiente':'resuelto';lab()};
  var mv=document.getElementById('sMove');
  var mlab=function(){mv.textContent=moving?'Listo, ubicado':'Mover pin'};mlab();
  mv.onclick=function(){if(moving){stopMove()}else{startMove(id)}mlab()};
  document.getElementById('sSave').onclick=async function(){
    r.cat=cur;r.note=note.value.trim();r.status=status;await put(r);stopMove();closeSheet();render();toast('Cambios guardados');
  };
  var dl=document.getElementById('sDel'),armed=false;
  dl.onclick=async function(){
    if(!armed){armed=true;dl.textContent='Tocá de nuevo para eliminar';setTimeout(function(){armed=false;dl.textContent='Eliminar'},3000);return}
    await del(id);reports=reports.filter(function(x){return x.id!==id});stopMove();closeSheet();render();toast('Registro eliminado');
  };
  dl.textContent='Eliminar';
}
function closeSheet(){sheet.classList.remove('open');selected=null;render()}
function startMove(id){
  stopMove();var m=markers[id];if(!m)return;moving=id;m.dragging.enable();toast('Arrastrá el pin hasta el lugar exacto');
}
function stopMove(){if(moving&&markers[moving]&&markers[moving].dragging)markers[moving].dragging.disable();moving=false}
map.on('click',function(e){
  if(settingSchool){school={lat:e.latlng.lat,lng:e.latlng.lng};save('eco66_school',school);drawSchool();settingSchool=false;toast('Escuela 66 fijada en este punto');return}
  if(sheet.classList.contains('open')){stopMove();closeSheet()}
  menu.hidden=true;
});

/* ---------- botones ---------- */
var menu=document.getElementById('menu'),settingSchool=false;
function $(id){return document.getElementById(id)}
$('btnCam').onclick=function(){$('inCam').click()};
$('btnGal').onclick=function(){$('inGal').click()};
$('inCam').onchange=function(e){addFromFile(e.target.files[0]);e.target.value=''};
$('inGal').onchange=function(e){addFromFile(e.target.files[0]);e.target.value=''};
$('fabSchool').onclick=function(){map.setView([school.lat,school.lng],17)};
$('fabMe').onclick=async function(){
  var p=await whereAmI();if(!p){toast('No pude obtener tu ubicación. Revisá el permiso del navegador');return}
  if(meMarker)map.removeLayer(meMarker);
  meMarker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(map);
  map.setView([p.lat,p.lng],17);
};
$('fabSat').onclick=function(){
  var on=$('fabSat').getAttribute('aria-pressed')!=='true';
  $('fabSat').setAttribute('aria-pressed',String(on));
  if(on){map.removeLayer(street);sat.addTo(map)}else{map.removeLayer(sat);street.addTo(map)}
};
$('fabMenu').onclick=function(){menu.hidden=!menu.hidden};
$('mClose').onclick=function(){menu.hidden=true};
$('mSetSchool').onclick=function(){menu.hidden=true;settingSchool=true;toast('Tocá en el mapa donde queda la Escuela 66')};
$('mSchoolHere').onclick=async function(){
  menu.hidden=true;var p=await whereAmI();if(!p){toast('No pude obtener tu ubicación');return}
  school=p;save('eco66_school',school);drawSchool();map.setView([p.lat,p.lng],17);toast('Escuela 66 fijada en tu ubicación');
};
function download(name,type,text){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$('mCsv').onclick=function(){
  menu.hidden=true;
  var q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var rows=[['fecha','tipo','estado','descripcion','latitud','longitud','enlace_mapa'].join(',')];
  reports.forEach(function(r){rows.push([q(r.created),q(catName(r.cat)),q(r.status),q(r.note),r.lat,r.lng,q('https://www.google.com/maps?q='+r.lat+','+r.lng)].join(','))});
  download('ecoradar66.csv','text/csv;charset=utf-8','﻿'+rows.join('\n'));
};
$('mJson').onclick=function(){
  menu.hidden=true;download('ecoradar66-copia.json','application/json',JSON.stringify({school:school,reports:reports}));
};
$('mImport').onclick=function(){menu.hidden=true;$('inImp').click()};
$('inImp').onchange=async function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    var d=JSON.parse(await f.text()),n=0;
    for(var i=0;i<(d.reports||[]).length;i++){var r=d.reports[i];if(r&&r.id&&r.photo&&!reports.some(function(x){return x.id===r.id})){await put(r);reports.push(r);n++}}
    if(d.school){school=d.school;save('eco66_school',school);drawSchool()}
    render();toast(n+' registros importados');
  }catch(err){toast('El archivo no es una copia válida')}
};
var tt;function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},2800)}

/* ---------- inicio ---------- */
drawFilters();
